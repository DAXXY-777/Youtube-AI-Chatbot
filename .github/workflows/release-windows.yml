name: Windows release

on:
  pull_request:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install UV and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --group build
      - name: Run tests
        run: uv run python -m unittest discover -s tests -v

  build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install UV and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --group build
      - name: Build desktop bundle
        run: pwsh scripts/build_windows.ps1
      - name: Upload unsigned bundle to release job
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-bundle
          path: dist/YT Livestream Chatbot
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download desktop bundle
        uses: actions/download-artifact@v4
        with:
          name: windows-desktop-bundle
          path: dist/YT Livestream Chatbot
      - name: Sign desktop executable
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: pwsh scripts/sign_release.ps1 -Path "dist/YT Livestream Chatbot/YT Livestream Chatbot.exe"
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Derive release version
        id: version
        shell: pwsh
        run: |
          $value = "${{ github.ref_name }}".TrimStart("v")
          "value=$value" >> $env:GITHUB_OUTPUT
      - name: Build installer
        shell: pwsh
        run: |
          $sourceDir = (Resolve-Path "dist\YT Livestream Chatbot").Path
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.version.outputs.value }}" "/DSourceDir=$sourceDir" installer\YT-Livestream-Chatbot.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed." }
      - name: Sign installer
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: pwsh scripts/sign_release.ps1 -Path "release/YT-Livestream-Chatbot-Setup-${{ steps.version.outputs.value }}.exe"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "release/YT-Livestream-Chatbot-Setup-${{ steps.version.outputs.value }}.exe" --generate-notes --title "YT Livestream Chatbot ${{ github.ref_name }}"
